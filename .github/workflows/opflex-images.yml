name: Opflex feature image build

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: opflex-feature-tag-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH || 'mmr-6.1.1' }}
  UPSTREAM_ID: ${{ vars.UPSTREAM_ID }}
  CICD_BRANCH: ${{ vars.CICD_BRANCH || 'mmr-6.1.1' }}
  SKIP_CICD_STATUS: ${{ vars.SKIP_CICD_STATUS || 'true' }}
  GHA_PLATFORM: linux/amd64
  DOCKER_BUILDKIT: "1"

jobs:
  validate-source:
    name: Validate Jenkins feature tag
    if: github.event_name == 'push' && github.event.deleted == false && github.repository == 'noironetworks/opflex' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      opflex-commit: ${{ steps.source.outputs.opflex_commit }}
      date-tag: ${{ steps.source.outputs.date_tag }}
      image-tag: ${{ steps.source.outputs.image_tag }}
      dated-image-tag: ${{ steps.source.outputs.dated_image_tag }}
      image-z-tag: ${{ steps.source.outputs.image_z_tag }}
      release-tag: ${{ steps.derive.outputs.release_tag }}
      safe-tag: ${{ steps.derive.outputs.safe_tag }}

    steps:
      - name: Check out tagged feature source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Derive release identifiers from tag
        id: derive
        shell: bash
        run: |
          set -Eeuo pipefail

          # Trigger tag is the plain release tag (e.g. 6.1.1.7); UPSTREAM_ID comes from the repo variable.
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Trigger tag ${tag} is not a release tag of form N.N.N.N (e.g. 6.1.1.7)"
            exit 1
          }
          [[ -n "${UPSTREAM_ID}" ]] || {
            echo "::error::UPSTREAM_ID is empty; set the UPSTREAM_ID Actions variable on this repository (e.g. 81c2369)"
            exit 1
          }
          [[ "${UPSTREAM_ID}" =~ ^[0-9a-f]+$ ]] || {
            echo "::error::UPSTREAM_ID must be a lowercase hex id (e.g. 81c2369)"
            exit 1
          }
          {
            echo "RELEASE_TAG=${tag}"
            echo "SAFE_TAG=${tag}"
          } >> "${GITHUB_ENV}"
          {
            echo "release_tag=${tag}"
            echo "safe_tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate annotated tag and feature head
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "${GITHUB_REF}" == "refs/tags/${SAFE_TAG}" ]] || {
            echo "::error::Unexpected trigger ref ${GITHUB_REF}"
            exit 1
          }
          [[ "${GITHUB_REF_NAME}" == "${SAFE_TAG}" ]] || {
            echo "::error::Unexpected trigger tag ${GITHUB_REF_NAME}"
            exit 1
          }

          git fetch --force --no-tags origin \
            "+refs/tags/${SAFE_TAG}:refs/tags/${SAFE_TAG}"
          [[ "$(git cat-file -t "refs/tags/${SAFE_TAG}")" == "tag" ]] || {
            echo "::error::Safe Jenkins tag ${SAFE_TAG} must be annotated"
            exit 1
          }

          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          tagged_commit="$(git rev-parse "refs/tags/${SAFE_TAG}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          source_commit="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          [[ "${tagged_commit}" == "${checked_out_commit}" ]] || {
            echo "::error::Tag ${SAFE_TAG} moved after this run was queued; refusing superseded run"
            exit 1
          }
          [[ "${tagged_commit}" == "${source_commit}" ]] || {
            echo "::error::Tag ${SAFE_TAG} resolves to ${tagged_commit}, not current ${SOURCE_BRANCH} head ${source_commit}"
            exit 1
          }
          [[ "${GITHUB_RUN_NUMBER}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::GITHUB_RUN_NUMBER must be a positive integer"
            exit 1
          }

          date_tag="$(date -u +%m%d%y)"
          image_tag="${RELEASE_TAG}.${UPSTREAM_ID}"
          dated_image_tag="${image_tag}.${date_tag}.${GITHUB_RUN_NUMBER}"
          image_z_tag="${image_tag}.z"
          escaped_release_tag="${RELEASE_TAG//./\\.}"
          [[ "${image_tag}" =~ ^${escaped_release_tag}\.${UPSTREAM_ID}$ ]] || {
            echo "::error::Generated image tag ${image_tag} is invalid"
            exit 1
          }
          [[ "${dated_image_tag}" =~ ^${escaped_release_tag}\.${UPSTREAM_ID}\.[0-9]{6}\.[0-9]+$ ]] || {
            echo "::error::Generated dated image tag ${dated_image_tag} is invalid"
            exit 1
          }
          [[ "${image_z_tag}" == "${RELEASE_TAG}.${UPSTREAM_ID}.z" ]] || {
            echo "::error::Generated z image tag ${image_z_tag} is invalid"
            exit 1
          }

          echo "opflex_commit=${tagged_commit}" >> "${GITHUB_OUTPUT}"
          echo "date_tag=${date_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "dated_image_tag=${dated_image_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_z_tag=${image_z_tag}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Validated opflex pilot source"
            echo
            echo "Commit: \`${tagged_commit}\`"
            echo
            echo "Travis-compatible image tags: \`${image_tag}\`, \`${dated_image_tag}\`, and \`${image_z_tag}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate CICD status setting
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SKIP_CICD_STATUS}" == "true" || "${SKIP_CICD_STATUS}" == "false" ]] || {
            echo "::error::SKIP_CICD_STATUS must be exactly true or false"
            exit 1
          }
      - name: Record disabled test CICD status publication
        if: env.SKIP_CICD_STATUS == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "SKIP_CICD_STATUS=true; CICD status preview publication is disabled and image publication will continue."

  build-base:
    name: Build and publish opflex-build-base
    needs: validate-source
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      quay-digest: ${{ steps.publish.outputs.quay_digest }}
      cicd_commit: ${{ steps.cicd.outputs.cicd_commit }}
    env:
      OPFLEX_COMMIT: ${{ needs.validate-source.outputs.opflex-commit }}
      GHA_DATE_TAG: ${{ needs.validate-source.outputs.date-tag }}
      IMAGE_TAG: ${{ needs.validate-source.outputs.image-tag }}
      GHA_DATED_IMAGE_TAG: ${{ needs.validate-source.outputs.dated-image-tag }}
      UPSTREAM_IMAGE_Z_TAG: ${{ needs.validate-source.outputs.image-z-tag }}
      RELEASE_TAG: ${{ needs.validate-source.outputs.release-tag }}
      SAFE_TAG: ${{ needs.validate-source.outputs.safe-tag }}
      GHA_OPFLEX_BUILD_PHASE: base

    steps:
      - name: Check out validated opflex source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate-source.outputs.opflex-commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize base job directories
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/opflex-base-ci-artifacts"
          install -d -m 700 "${artifact_dir}"
          echo "CI_ARTIFACT_DIR=${artifact_dir}" >> "${GITHUB_ENV}"

      - name: Authenticate to feature registries
        shell: bash
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_NOIROLABS_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_NOIROLABS_TOKEN }}
          QUAY_NOIRO_USERNAME: ${{ secrets.QUAY_NOIRO_USERNAME }}
          QUAY_NOIRO_TOKEN: ${{ secrets.QUAY_NOIRO_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_NOIRO_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_NOIRO_TOKEN }}
        run: |
          set -Eeuo pipefail

          [[ -n "${QUAY_USERNAME}" ]] || { echo "::error::Missing QUAY_NOIROLABS_USERNAME"; exit 1; }
          [[ -n "${QUAY_TOKEN}" ]] || { echo "::error::Missing QUAY_NOIROLABS_TOKEN"; exit 1; }
          [[ "${QUAY_USERNAME}" == noirolabs+?* ]] || {
            echo "::error::QUAY_NOIROLABS_USERNAME must be the full noirolabs robot username"
            exit 1
          }
          [[ -n "${QUAY_NOIRO_USERNAME}" ]] || { echo "::error::Missing QUAY_NOIRO_USERNAME"; exit 1; }
          [[ -n "${QUAY_NOIRO_TOKEN}" ]] || { echo "::error::Missing QUAY_NOIRO_TOKEN"; exit 1; }
          [[ "${QUAY_NOIRO_USERNAME}" == noiro+?* ]] || {
            echo "::error::QUAY_NOIRO_USERNAME must be the full noiro robot username"
            exit 1
          }
          [[ -n "${DOCKER_USERNAME}" ]] || { echo "::error::Missing DOCKER_NOIRO_USERNAME"; exit 1; }
          [[ -n "${DOCKER_TOKEN}" ]] || { echo "::error::Missing DOCKER_NOIRO_TOKEN"; exit 1; }

          docker_config="${RUNNER_TEMP}/opflex-docker-config"
          install -d -m 700 "${docker_config}"
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"
          if ! printf '%s' "${QUAY_TOKEN}" |
            DOCKER_CONFIG="${docker_config}" docker login quay.io \
              --username "${QUAY_USERNAME}" --password-stdin \
              >"${RUNNER_TEMP}/quay-login.log" 2>&1; then
            echo "::error::Quay robot authentication failed"
            exit 1
          fi
          if ! printf '%s' "${DOCKER_TOKEN}" |
            DOCKER_CONFIG="${docker_config}" docker login docker.io \
              --username "${DOCKER_USERNAME}" --password-stdin \
              >"${RUNNER_TEMP}/docker-login.log" 2>&1; then
            echo "::error::Docker Hub authentication failed"
            exit 1
          fi
          chmod 600 "${docker_config}/config.json"

          noiro_config="${RUNNER_TEMP}/opflex-quay-noiro-docker-config"
          install -d -m 700 "${noiro_config}"
          echo "QUAY_NOIRO_DOCKER_CONFIG=${noiro_config}" >> "${GITHUB_ENV}"
          if ! printf '%s' "${QUAY_NOIRO_TOKEN}" |
            DOCKER_CONFIG="${noiro_config}" docker login quay.io \
              --username "${QUAY_NOIRO_USERNAME}" --password-stdin \
              >"${RUNNER_TEMP}/quay-noiro-login.log" 2>&1; then
            echo "::error::noiro Quay robot authentication failed"
            exit 1
          fi
          chmod 600 "${noiro_config}/config.json"
          echo "Registry authentication succeeded using separate ephemeral credential directories."

      - name: Clone latest CICD feature scripts
        id: cicd
        shell: bash
        run: |
          set -Eeuo pipefail

          cicd_dir="${RUNNER_TEMP}/cicd"
          git init --quiet "${cicd_dir}"
          git -C "${cicd_dir}" remote add origin \
            https://github.com/noironetworks/cicd.git
          git -C "${cicd_dir}" fetch --quiet --depth=1 origin \
            "+refs/heads/${CICD_BRANCH}:refs/remotes/origin/${CICD_BRANCH}"
          git -C "${cicd_dir}" checkout --quiet --detach \
            "refs/remotes/origin/${CICD_BRANCH}"
          resolved_commit="$(git -C "${cicd_dir}" rev-parse HEAD)"
          branch_commit="$(git -C "${cicd_dir}" rev-parse "refs/remotes/origin/${CICD_BRANCH}")"
          [[ "${resolved_commit}" == "${branch_commit}" ]] || {
            echo "::error::CICD checkout does not match ${CICD_BRANCH} head"
            exit 1
          }
          cicd_release="$(sed -nE 's/^RELEASE_TAG="([^"]+)"/\1/p' "${cicd_dir}/travis/globals.sh")"
          [[ "${cicd_release}" == "${RELEASE_TAG}" ]] || {
            echo "::error::CICD release ${cicd_release} does not match ${RELEASE_TAG}"
            exit 1
          }
          echo "CICD_DIR=${cicd_dir}" >> "${GITHUB_ENV}"
          echo "CICD_COMMIT=${resolved_commit}" >> "${GITHUB_ENV}"
          echo "cicd_commit=${resolved_commit}" >> "${GITHUB_OUTPUT}"

      - name: Record base runner preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${CI_ARTIFACT_DIR}"
          {
            echo "opflex_commit=${OPFLEX_COMMIT}"
            echo "trigger_tag=${SAFE_TAG}"
            echo "image_tag=${IMAGE_TAG}"
            echo "dated_image_tag=${GHA_DATED_IMAGE_TAG}"
            echo "image_z_tag=${UPSTREAM_IMAGE_Z_TAG}"
            echo "build_phase=${GHA_OPFLEX_BUILD_PHASE}"
            echo "platform=${GHA_PLATFORM}"
            echo "cicd_commit=${CICD_COMMIT}"
            echo "docker_client=$(docker version --format '{{.Client.Version}}')"
            echo "docker_server=$(docker version --format '{{.Server.Version}}')"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          } > "${CI_ARTIFACT_DIR}/build-inputs.txt"
          cat "${CI_ARTIFACT_DIR}/build-inputs.txt"
          df -h | tee "${CI_ARTIFACT_DIR}/disk-before.txt"
          docker system df | tee "${CI_ARTIFACT_DIR}/docker-disk-before.txt"

      - name: Build and publish base through CICD
        id: publish
        shell: bash
        env:
          TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
          TRAVIS_REPO_SLUG: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          export TRAVIS_TAG="${RELEASE_TAG}"
          export TRAVIS_COMMIT="${OPFLEX_COMMIT}"
          export GHA_TRIGGER_TAG="${SAFE_TAG}"
          export GHA_DATE_TAG

          build_log="${CI_ARTIFACT_DIR}/build-and-publish-base.log"
          "${CICD_DIR}/travis/build-push-opflex-images.sh" >"${build_log}" 2>&1 &
          build_pid=$!
          cleanup_build() {
            if kill -0 "${build_pid}" 2>/dev/null; then
              kill "${build_pid}" 2>/dev/null || true
              wait "${build_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup_build EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          while kill -0 "${build_pid}" 2>/dev/null; do
            echo "Opflex base image build is still running ($(date -u +%FT%TZ)); full output will be uploaded."
            sleep 60
          done
          set +e
          wait "${build_pid}"
          build_status=$?
          set -e
          trap - EXIT INT TERM
          if [[ "${build_status}" -ne 0 ]]; then
            echo "::error::Opflex base image build failed; final 200 lines follow"
            tail -200 "${build_log}"
            exit "${build_status}"
          fi
          tail -50 "${build_log}"

          validate_manifest() {
            local manifest_file=$1
            local registry_prefix=$2
            local image=$3
            local expected_tags_csv=$4
            local expected_tags=()
            local expected_count
            IFS=',' read -r -a expected_tags <<< "${expected_tags_csv}"
            [[ -s "${manifest_file}" ]] || { echo "::error::Missing ${manifest_file}"; return 1; }
            [[ "$(head -n 1 "${manifest_file}")" == $'image\tdigest' ]] || {
              echo "::error::Unexpected manifest header in ${manifest_file}"
              return 1
            }
            expected_count="${#expected_tags[@]}"
            [[ "$(tail -n +2 "${manifest_file}" | wc -l)" -eq "${expected_count}" ]] || {
              echo "::error::Expected ${expected_count} publications in ${manifest_file}"
              return 1
            }
            while IFS=$'\t' read -r published_ref published_digest; do
              [[ "${published_ref}" == "${registry_prefix}/${image}:"* ]] || {
                echo "::error::Unexpected published image ${published_ref}"
                return 1
              }
              [[ "${published_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "::error::Invalid digest for ${published_ref}"
                return 1
              }
            done < <(tail -n +2 "${manifest_file}")
            for expected_tag in "${expected_tags[@]}"; do
              expected_ref="${registry_prefix}/${image}:${expected_tag}"
              occurrence_count="$(awk -F '\t' -v ref="${expected_ref}" '$1 == ref { count++ } END { print count + 0 }' "${manifest_file}")"
              [[ "${occurrence_count}" -eq 1 ]] || {
                echo "::error::Expected one publication of ${expected_ref}, found ${occurrence_count}"
                return 1
              }
            done
          }

          quay_ref="quay.io/noirolabs/opflex-build-base:${IMAGE_TAG}"
          quay_manifest="${CI_ARTIFACT_DIR}/quay-published-images.tsv"
          quay_noiro_manifest="${CI_ARTIFACT_DIR}/quay-noiro-published-images.tsv"
          docker_manifest="${CI_ARTIFACT_DIR}/docker-published-images.tsv"
          validate_manifest "${quay_manifest}" quay.io/noirolabs opflex-build-base \
            "${IMAGE_TAG},${GHA_DATED_IMAGE_TAG},${UPSTREAM_IMAGE_Z_TAG}"
          validate_manifest "${quay_noiro_manifest}" quay.io/noiro opflex-build-base \
            "${GHA_DATED_IMAGE_TAG},${UPSTREAM_IMAGE_Z_TAG}"
          validate_manifest "${docker_manifest}" docker.io/noiro opflex-build-base \
            "${GHA_DATED_IMAGE_TAG},${UPSTREAM_IMAGE_Z_TAG}"
          quay_digest="$(awk -F '\t' -v ref="${quay_ref}" '$1 == ref { print $2 }' "${quay_manifest}")"
          echo "quay_digest=${quay_digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Travis-compatible opflex build-base publication"
            echo
            echo "Published \`${IMAGE_TAG}\`, \`${GHA_DATED_IMAGE_TAG}\`, and \`${UPSTREAM_IMAGE_Z_TAG}\` without any \`.gha\` image tags."
            echo
            echo '| `.z` image | Digest |'
            echo '|---|---|'
            for registry in quay.io/noirolabs quay.io/noiro docker.io/noiro; do
              case "${registry}" in
                quay.io/noirolabs) manifest="${quay_manifest}" ;;
                quay.io/noiro) manifest="${quay_noiro_manifest}" ;;
                docker.io/noiro) manifest="${docker_manifest}" ;;
              esac
              z_ref="${registry}/opflex-build-base:${UPSTREAM_IMAGE_Z_TAG}"
              z_digest="$(awk -F '\t' -v ref="${z_ref}" '$1 == ref { print $2 }' "${manifest}")"
              printf '| `%s` | `%s` |\n' "${z_ref}" "${z_digest}"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record base final diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          artifact_dir="${CI_ARTIFACT_DIR:-${RUNNER_TEMP}/opflex-base-ci-artifacts}"
          mkdir -p "${artifact_dir}"
          df -h > "${artifact_dir}/disk-after.txt"
          docker system df -v > "${artifact_dir}/docker-disk-after.txt"
          df -h
          docker system df

      - name: Upload base build and publication logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opflex-build-base-feature-${{ github.run_id }}
          path: ${{ runner.temp }}/opflex-base-ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary registry credentials
        if: always()
        shell: bash
        run: |
          set +e
          expected_config="${RUNNER_TEMP}/opflex-docker-config"
          expected_noiro_config="${RUNNER_TEMP}/opflex-quay-noiro-docker-config"
          if [[ "${DOCKER_CONFIG:-}" == "${expected_config}" ]]; then
            docker logout quay.io >/dev/null 2>&1
            docker logout docker.io >/dev/null 2>&1
            rm -f -- "${expected_config}/config.json"
            rmdir "${expected_config}" 2>/dev/null || true
          fi
          if [[ "${QUAY_NOIRO_DOCKER_CONFIG:-}" == "${expected_noiro_config}" ]]; then
            DOCKER_CONFIG="${expected_noiro_config}" docker logout quay.io >/dev/null 2>&1
            rm -f -- "${expected_noiro_config}/config.json"
            rmdir "${expected_noiro_config}" 2>/dev/null || true
          fi

  build-runtime:
    name: Build opflex and publish the runtime image
    needs:
      - validate-source
      - build-base
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      OPFLEX_COMMIT: ${{ needs.validate-source.outputs.opflex-commit }}
      GHA_DATE_TAG: ${{ needs.validate-source.outputs.date-tag }}
      IMAGE_TAG: ${{ needs.validate-source.outputs.image-tag }}
      GHA_DATED_IMAGE_TAG: ${{ needs.validate-source.outputs.dated-image-tag }}
      UPSTREAM_IMAGE_Z_TAG: ${{ needs.validate-source.outputs.image-z-tag }}
      RELEASE_TAG: ${{ needs.validate-source.outputs.release-tag }}
      SAFE_TAG: ${{ needs.validate-source.outputs.safe-tag }}
      GHA_OPFLEX_BUILD_PHASE: runtime
      EXPECTED_OPFLEX_BASE_DIGEST: ${{ needs.build-base.outputs.quay-digest }}
      CICD_COMMIT: ${{ needs.build-base.outputs.cicd_commit }}

    steps:
      - name: Check out validated opflex source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate-source.outputs.opflex-commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize runtime job directories
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/opflex-runtime-ci-artifacts"
          install -d -m 700 "${artifact_dir}"
          echo "CI_ARTIFACT_DIR=${artifact_dir}" >> "${GITHUB_ENV}"

      - name: Set up Java 11 for Genie
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Authenticate to feature registries
        shell: bash
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_NOIROLABS_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_NOIROLABS_TOKEN }}
          QUAY_NOIRO_USERNAME: ${{ secrets.QUAY_NOIRO_USERNAME }}
          QUAY_NOIRO_TOKEN: ${{ secrets.QUAY_NOIRO_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_NOIRO_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_NOIRO_TOKEN }}
        run: |
          set -Eeuo pipefail

          [[ -n "${QUAY_USERNAME}" ]] || { echo "::error::Missing QUAY_NOIROLABS_USERNAME"; exit 1; }
          [[ -n "${QUAY_TOKEN}" ]] || { echo "::error::Missing QUAY_NOIROLABS_TOKEN"; exit 1; }
          [[ "${QUAY_USERNAME}" == noirolabs+?* ]] || {
            echo "::error::QUAY_NOIROLABS_USERNAME must be the full noirolabs robot username"
            exit 1
          }
          [[ -n "${QUAY_NOIRO_USERNAME}" ]] || { echo "::error::Missing QUAY_NOIRO_USERNAME"; exit 1; }
          [[ -n "${QUAY_NOIRO_TOKEN}" ]] || { echo "::error::Missing QUAY_NOIRO_TOKEN"; exit 1; }
          [[ "${QUAY_NOIRO_USERNAME}" == noiro+?* ]] || {
            echo "::error::QUAY_NOIRO_USERNAME must be the full noiro robot username"
            exit 1
          }
          [[ -n "${DOCKER_USERNAME}" ]] || { echo "::error::Missing DOCKER_NOIRO_USERNAME"; exit 1; }
          [[ -n "${DOCKER_TOKEN}" ]] || { echo "::error::Missing DOCKER_NOIRO_TOKEN"; exit 1; }

          docker_config="${RUNNER_TEMP}/opflex-docker-config"
          install -d -m 700 "${docker_config}"
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"
          if ! printf '%s' "${QUAY_TOKEN}" |
            DOCKER_CONFIG="${docker_config}" docker login quay.io \
              --username "${QUAY_USERNAME}" --password-stdin \
              >"${RUNNER_TEMP}/quay-login.log" 2>&1; then
            echo "::error::Quay robot authentication failed"
            exit 1
          fi
          if ! printf '%s' "${DOCKER_TOKEN}" |
            DOCKER_CONFIG="${docker_config}" docker login docker.io \
              --username "${DOCKER_USERNAME}" --password-stdin \
              >"${RUNNER_TEMP}/docker-login.log" 2>&1; then
            echo "::error::Docker Hub authentication failed"
            exit 1
          fi
          chmod 600 "${docker_config}/config.json"

          noiro_config="${RUNNER_TEMP}/opflex-quay-noiro-docker-config"
          install -d -m 700 "${noiro_config}"
          echo "QUAY_NOIRO_DOCKER_CONFIG=${noiro_config}" >> "${GITHUB_ENV}"
          if ! printf '%s' "${QUAY_NOIRO_TOKEN}" |
            DOCKER_CONFIG="${noiro_config}" docker login quay.io \
              --username "${QUAY_NOIRO_USERNAME}" --password-stdin \
              >"${RUNNER_TEMP}/quay-noiro-login.log" 2>&1; then
            echo "::error::noiro Quay robot authentication failed"
            exit 1
          fi
          chmod 600 "${noiro_config}/config.json"
          echo "Registry authentication succeeded using separate ephemeral credential directories."

      - name: Clone CICD scripts used by the base job
        shell: bash
        run: |
          set -Eeuo pipefail

          cicd_dir="${RUNNER_TEMP}/cicd"
          git init --quiet "${cicd_dir}"
          git -C "${cicd_dir}" remote add origin \
            https://github.com/noironetworks/cicd.git
          git -C "${cicd_dir}" fetch --quiet --depth=1 origin "${CICD_COMMIT}"
          git -C "${cicd_dir}" checkout --quiet --detach FETCH_HEAD
          actual_commit="$(git -C "${cicd_dir}" rev-parse HEAD)"
          [[ "${actual_commit}" == "${CICD_COMMIT}" ]] || {
            echo "::error::Expected CICD ${CICD_COMMIT}, found ${actual_commit}"
            exit 1
          }
          cicd_release="$(sed -nE 's/^RELEASE_TAG="([^"]+)"/\1/p' "${cicd_dir}/travis/globals.sh")"
          [[ "${cicd_release}" == "${RELEASE_TAG}" ]] || {
            echo "::error::CICD release ${cicd_release} does not match ${RELEASE_TAG}"
            exit 1
          }
          echo "CICD_DIR=${cicd_dir}" >> "${GITHUB_ENV}"

      - name: Record runtime runner preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${CI_ARTIFACT_DIR}"
          {
            echo "opflex_commit=${OPFLEX_COMMIT}"
            echo "trigger_tag=${SAFE_TAG}"
            echo "image_tag=${IMAGE_TAG}"
            echo "dated_image_tag=${GHA_DATED_IMAGE_TAG}"
            echo "image_z_tag=${UPSTREAM_IMAGE_Z_TAG}"
            echo "build_phase=${GHA_OPFLEX_BUILD_PHASE}"
            echo "platform=${GHA_PLATFORM}"
            echo "expected_base_digest=${EXPECTED_OPFLEX_BASE_DIGEST}"
            echo "cicd_commit=${CICD_COMMIT}"
            echo "java_version=$(java -version 2>&1 | head -n 1)"
            echo "maven_version=$(mvn --version | head -n 1)"
            echo "docker_client=$(docker version --format '{{.Client.Version}}')"
            echo "docker_server=$(docker version --format '{{.Server.Version}}')"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          } > "${CI_ARTIFACT_DIR}/build-inputs.txt"
          cat "${CI_ARTIFACT_DIR}/build-inputs.txt"
          df -h | tee "${CI_ARTIFACT_DIR}/disk-before.txt"
          docker system df | tee "${CI_ARTIFACT_DIR}/docker-disk-before.txt"

      - name: Build and publish the runtime image through CICD
        shell: bash
        env:
          TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
          TRAVIS_REPO_SLUG: ${{ github.repository }}
          TRAVIS_TAGGER: ${{ secrets.GITHUBACTIONS_TAGGER }}
        run: |
          set -Eeuo pipefail
          export TRAVIS_TAG="${RELEASE_TAG}"
          export TRAVIS_COMMIT="${OPFLEX_COMMIT}"
          export GHA_TRIGGER_TAG="${SAFE_TAG}"
          export GHA_DATE_TAG

          build_log="${CI_ARTIFACT_DIR}/build-and-publish-runtime.log"
          "${CICD_DIR}/travis/build-push-opflex-images.sh" >"${build_log}" 2>&1 &
          build_pid=$!
          cleanup_build() {
            if kill -0 "${build_pid}" 2>/dev/null; then
              kill "${build_pid}" 2>/dev/null || true
              wait "${build_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup_build EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          while kill -0 "${build_pid}" 2>/dev/null; do
            echo "Opflex runtime image build is still running ($(date -u +%FT%TZ)); full output will be uploaded."
            sleep 60
          done
          set +e
          wait "${build_pid}"
          build_status=$?
          set -e
          trap - EXIT INT TERM
          if [[ "${build_status}" -ne 0 ]]; then
            echo "::error::Opflex runtime image build failed; final 200 lines follow"
            tail -200 "${build_log}"
            exit "${build_status}"
          fi
          tail -50 "${build_log}"

          validate_manifest() {
            local manifest_file=$1
            local registry_prefix=$2
            local image=$3
            local expected_tags_csv=$4
            local expected_tags=()
            local expected_count
            IFS=',' read -r -a expected_tags <<< "${expected_tags_csv}"
            [[ -s "${manifest_file}" ]] || { echo "::error::Missing ${manifest_file}"; return 1; }
            [[ "$(head -n 1 "${manifest_file}")" == $'image\tdigest' ]] || {
              echo "::error::Unexpected manifest header in ${manifest_file}"
              return 1
            }
            expected_count="${#expected_tags[@]}"
            [[ "$(tail -n +2 "${manifest_file}" | wc -l)" -eq "${expected_count}" ]] || {
              echo "::error::Expected ${expected_count} publications in ${manifest_file}"
              return 1
            }
            while IFS=$'\t' read -r published_ref published_digest; do
              [[ "${published_ref}" == "${registry_prefix}/${image}:"* ]] || {
                echo "::error::Unexpected published image ${published_ref}"
                return 1
              }
              [[ "${published_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "::error::Invalid digest for ${published_ref}"
                return 1
              }
            done < <(tail -n +2 "${manifest_file}")
            for expected_tag in "${expected_tags[@]}"; do
              expected_ref="${registry_prefix}/${image}:${expected_tag}"
              occurrence_count="$(awk -F '\t' -v ref="${expected_ref}" '$1 == ref { count++ } END { print count + 0 }' "${manifest_file}")"
              [[ "${occurrence_count}" -eq 1 ]] || {
                echo "::error::Expected one publication of ${expected_ref}, found ${occurrence_count}"
                return 1
              }
            done
          }

          quay_manifest="${CI_ARTIFACT_DIR}/quay-published-images.tsv"
          quay_noiro_manifest="${CI_ARTIFACT_DIR}/quay-noiro-published-images.tsv"
          docker_manifest="${CI_ARTIFACT_DIR}/docker-published-images.tsv"
          validate_manifest "${quay_manifest}" quay.io/noirolabs opflex \
            "${IMAGE_TAG},${GHA_DATED_IMAGE_TAG},${UPSTREAM_IMAGE_Z_TAG}"
          validate_manifest "${quay_noiro_manifest}" quay.io/noiro opflex \
            "${GHA_DATED_IMAGE_TAG},${UPSTREAM_IMAGE_Z_TAG}"
          validate_manifest "${docker_manifest}" docker.io/noiro opflex \
            "${GHA_DATED_IMAGE_TAG},${UPSTREAM_IMAGE_Z_TAG}"
          {
            echo "### Travis-compatible opflex runtime publication"
            echo
            echo "Built the intermediate builder and final runtime image from base digest \`${EXPECTED_OPFLEX_BASE_DIGEST}\`."
            echo "Only the final \`opflex\` image was published; \`opflex-build\` remained local to the job."
            echo "Published \`${IMAGE_TAG}\`, \`${GHA_DATED_IMAGE_TAG}\`, and \`${UPSTREAM_IMAGE_Z_TAG}\` without any \`.gha\` image tags."
            echo
            echo '| `.z` image | Digest |'
            echo '|---|---|'
            for registry in quay.io/noirolabs quay.io/noiro docker.io/noiro; do
              case "${registry}" in
                quay.io/noirolabs) manifest="${quay_manifest}" ;;
                quay.io/noiro) manifest="${quay_noiro_manifest}" ;;
                docker.io/noiro) manifest="${docker_manifest}" ;;
              esac
              z_ref="${registry}/opflex:${UPSTREAM_IMAGE_Z_TAG}"
              z_digest="$(awk -F '\t' -v ref="${z_ref}" '$1 == ref { print $2 }' "${manifest}")"
              printf '| `%s` | `%s` |\n' "${z_ref}" "${z_digest}"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record runtime final diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          artifact_dir="${CI_ARTIFACT_DIR:-${RUNNER_TEMP}/opflex-runtime-ci-artifacts}"
          mkdir -p "${artifact_dir}"
          df -h > "${artifact_dir}/disk-after.txt"
          docker system df -v > "${artifact_dir}/docker-disk-after.txt"
          df -h
          docker system df

      - name: Upload runtime build and publication logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opflex-runtime-feature-${{ github.run_id }}
          path: ${{ runner.temp }}/opflex-runtime-ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary registry credentials
        if: always()
        shell: bash
        run: |
          set +e
          expected_config="${RUNNER_TEMP}/opflex-docker-config"
          expected_noiro_config="${RUNNER_TEMP}/opflex-quay-noiro-docker-config"
          if [[ "${DOCKER_CONFIG:-}" == "${expected_config}" ]]; then
            docker logout quay.io >/dev/null 2>&1
            docker logout docker.io >/dev/null 2>&1
            rm -f -- "${expected_config}/config.json"
            rmdir "${expected_config}" 2>/dev/null || true
          fi
          if [[ "${QUAY_NOIRO_DOCKER_CONFIG:-}" == "${expected_noiro_config}" ]]; then
            DOCKER_CONFIG="${expected_noiro_config}" docker logout quay.io >/dev/null 2>&1
            rm -f -- "${expected_noiro_config}/config.json"
            rmdir "${expected_noiro_config}" 2>/dev/null || true
          fi
